name: Build Android APK

# Run it by hand: GitHub -> Actions -> "Build Android APK" -> Run workflow.
# When it finishes, download the "hithozha-android-apk" file from the run page, unzip it,
# and install the .apk on an Android phone.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Public settings baked into the app at build time. Add these two under
      # Settings -> Secrets and variables -> Actions -> New repository secret:
      #   SUPABASE_URL       (https://<project>.supabase.co)
      #   SUPABASE_ANON_KEY  (the publishable key, starts with sb_publishable_)
      # (The old names EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_ANON_KEY still work.)
      # The EXPO_PUBLIC_ prefix below is only the label the app framework needs for settings
      # that go inside the app; it does not use any Expo account or service.
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the two app settings exist
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "Missing secret SUPABASE_URL"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || { echo "Missing secret SUPABASE_ANON_KEY"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm ci

      - name: Make the Android project
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: hithozha-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error
