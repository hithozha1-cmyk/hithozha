project_id = "hithozha"

[functions.r2-presign]
verify_jwt = true

[functions.create-payment]
verify_jwt = true

[functions.cancel-order]
verify_jwt = true

[functions.review-identity]
verify_jwt = true

# Razorpay calls this directly and cannot send a Supabase JWT. It authenticates
# requests by checking the Razorpay signature instead.
[functions.razorpay-webhook]
verify_jwt = false

# The Supabase Database Webhook calls this with a shared secret header, not a user JWT.
[functions.send-push]
verify_jwt = false
